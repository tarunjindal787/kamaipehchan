<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KamaiPehchan - Lender Underwriting Dashboard</title>
  <style>
    :root {
      --bg-color: #f7f9fc;
      --card-bg: #ffffff;
      --text-main: #1a202c;
      --text-muted: #718096;
      --border-color: #e2e8f0;
      --primary: #4a5568;
      --primary-hover: #2d3748;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      margin: 0; padding: 0;
      background: var(--bg-color); color: var(--text-main);
      font-family: var(--font-family);
      -webkit-font-smoothing: antialiased;
      display: flex; flex-direction: column; height: 100vh;
    }
    .header {
      background: #1a202c; color: #fff;
      padding: 16px 24px; display: flex; align-items: center; justify-content: space-between;
    }
    .header h1 { margin: 0; font-size: 20px; font-weight: 600; display: flex; align-items: center; gap: 12px; }
    
    .search-bar {
      background: var(--card-bg);
      padding: 24px; border-bottom: 1px solid var(--border-color);
      display: flex; gap: 12px; justify-content: center;
    }
    .search-bar input {
      width: 100%; max-width: 400px; padding: 10px 16px;
      border: 1px solid var(--border-color); border-radius: 6px; font-size: 16px; outline: none;
    }
    .search-bar input:focus { border-color: var(--primary); }
    .search-bar button {
      background: var(--primary); color: #fff;
      border: none; border-radius: 6px; padding: 0 24px;
      font-size: 16px; font-weight: 600; cursor: pointer;
    }
    .search-bar button:hover { background: var(--primary-hover); }
    
    .workspace {
      flex: 1; display: flex; justify-content: center; align-items: center;
      padding: 24px; overflow: hidden;
    }
    .iframe-container {
      width: 100%; max-width: 700px; height: 100%;
      background: #fff; border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      border: 1px solid var(--border-color);
      overflow: hidden; display: none;
      flex-direction: column;
    }
    iframe {
      width: 100%; height: 100%; border: none;
    }
    .empty-state {
      text-align: center; color: var(--text-muted);
    }
    .empty-state svg { margin-bottom: 16px; opacity: 0.5; }
  </style>
</head>
<body>

<div class="header">
  <h1>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
      <line x1="16" y1="2" x2="16" y2="6"></line>
      <line x1="8" y1="2" x2="8" y2="6"></line>
      <line x1="3" y1="10" x2="21" y2="10"></line>
    </svg>
    Underwriting Portal
  </h1>
  <div style="font-size: 14px; opacity: 0.8;">Privacy Mode: Active (Redacted)</div>
</div>

<div class="search-bar">
  <input type="text" id="search-input" placeholder="Enter Worker Reference ID (e.g. worker_123)">
  <button id="search-btn">Fetch Passport</button>
</div>

<div class="workspace">
  <div class="empty-state" id="empty-state">
    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <h2>Lookup Applicant</h2>
    <p>Enter a worker ID above to request their privacy-preserving Credit Passport.</p>
  </div>
  
  <div class="iframe-container" id="iframe-container">
    <iframe id="passport-frame"></iframe>
  </div>
</div>

<script>
  function performSearch() {
    const val = document.getElementById('search-input').value.trim();
    if (!val) return;
    
    document.getElementById('empty-state').style.display = 'none';
    const container = document.getElementById('iframe-container');
    const frame = document.getElementById('passport-frame');
    
    // Wire securely to the lender view
    frame.src = '/passport.html?worker_id=' + encodeURIComponent(val) + '&view=lender';
    container.style.display = 'flex';
  }

  document.getElementById('search-btn').addEventListener('click', performSearch);
  document.getElementById('search-input').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') performSearch();
  });
</script>

</body>
</html>
